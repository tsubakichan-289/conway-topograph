[package]
name = "conway-topograph"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
serde = { version = "1", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
serde_json = "1"
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
thiserror = "2"
topograph-core = { path = "core" }
resvg = "0.45"

[workspace]
members = ["core"]
default-members = [".", "core"]
resolver = "3"
